name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-24.04
    # Skipped until the FLY_APP repository variable is set, so a freshly
    # created repository does not fail on its first push.
    if: vars.FLY_APP != ''
    environment:
      name: production
      url: https://${{ vars.PHX_HOST || format('{0}.fly.dev', vars.FLY_APP) }}
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
      PHX_HOST: ${{ vars.PHX_HOST || format('{0}.fly.dev', vars.FLY_APP) }}
      PRIVEE_IMAGE: ${{ vars.PRIVEE_IMAGE || 'ghcr.io/maxdac/privee:latest' }}
      PRIVEE_INSTANCE_NAME: ${{ vars.PRIVEE_INSTANCE_NAME }}
      PRIVEE_SOURCE_URL: ${{ vars.PRIVEE_SOURCE_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Check configuration
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Set the FLY_API_TOKEN secret (fly tokens create deploy -a $FLY_APP)."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy
        run: |
          args=(--app "$FLY_APP" --image "$PRIVEE_IMAGE" --ha=false --env "PHX_HOST=$PHX_HOST")
          if [ -n "$PRIVEE_INSTANCE_NAME" ]; then
            args+=(--env "PRIVEE_INSTANCE_NAME=$PRIVEE_INSTANCE_NAME")
          fi
          if [ -n "$PRIVEE_SOURCE_URL" ]; then
            args+=(--env "PRIVEE_SOURCE_URL=$PRIVEE_SOURCE_URL")
          fi
          echo "Deploying $PRIVEE_IMAGE to $FLY_APP ($PHX_HOST)"
          flyctl deploy "${args[@]}"
