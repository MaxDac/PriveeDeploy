# Fly.io configuration of your Privee instance.
# Reference: https://fly.io/docs/reference/configuration/
#
# The app name is not set here: the deploy workflow passes the FLY_APP
# repository variable (`fly deploy --app <name>` when deploying by hand).
# PHX_HOST is passed by the workflow too, defaulting to <FLY_APP>.fly.dev.

# Closest region to your users: https://fly.io/docs/reference/regions/
primary_region = 'ams'
kill_signal = 'SIGTERM'

[build]
  # Builds the Dockerfile of the Privee checkout on Fly's remote builders.

[deploy]
  # Runs database migrations before every release.
  release_command = '/app/bin/migrate'

[env]
  PORT = '8080'
  # Fly's X-Forwarded-For ends with "<client>, <app IP>": the client is the
  # second address from the right.
  PROXY_HOPS = '2'

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: Fly stops the machine when idle and starts it on the next
  # request, which keeps a small instance within the free allowance. Privee
  # keeps undelivered encrypted messages in memory, so they are lost whenever
  # the machine stops. For an always-on server set auto_stop_machines = 'off'
  # and min_machines_running = 1.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

# Privee must run on a single machine (chat storage is node-local).
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1